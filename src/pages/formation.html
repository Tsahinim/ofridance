<main id="main" class="chg-main">
  <div id="chg" class="chg" data-screen="home">

    <section class="chg-home" aria-labelledby="chg-home-h">
      <header class="chg-top">
        <a class="chg-logo" href="index.html" aria-label="OFRIDANCE, חזרה לאתר">{{MARK}}</a>
        <h1 id="chg-home-h">עימוד</h1>
        <label class="chg-search"><span data-icon="search" aria-hidden="true"></span><span class="sr-only">חיפוש</span><input id="chg-search" type="search" placeholder="חיפוש כוריאוגרפיה"></label>
      </header>
      <div class="chg-home-body"></div>
      <button id="chg-new" type="button" class="chg-fab" data-icon="plus" aria-label="כוריאוגרפיה חדשה"></button>
      <label class="chg-openfile">פתיחת קובץ<input id="chg-open-file" type="file" accept=".json,application/json" hidden></label>
      <nav class="chg-tabs" aria-label="מסכים">
        <button type="button" data-home-tab="recent" aria-selected="true">אחרונות</button>
        <button type="button" data-home-tab="library" aria-selected="false">ספרייה</button>
        <button type="button" data-home-tab="explore" aria-selected="false">רעיונות</button>
      </nav>
    </section>

    <section class="chg-editor" aria-label="עורך הכוריאוגרפיה">
      <header class="chg-top chg-etop">
        <button id="chg-back" type="button" class="chg-icon" data-icon="back" aria-label="חזרה לכוריאוגרפיות"></button>
        <span class="chg-title"></span>
        <div class="chg-etools">
          <button id="chg-undo" type="button" class="chg-icon" data-icon="undo" aria-label="ביטול"></button>
          <button id="chg-redo" type="button" class="chg-icon" data-icon="redo" aria-label="חזרה"></button>
          <button id="chg-music" type="button" class="chg-icon" data-icon="music" aria-label="מוזיקה"></button>
          <button id="chg-layers" type="button" class="chg-icon" data-icon="layers" aria-label="כל המערכים ותצוגה"></button>
          <button id="chg-settings" type="button" class="chg-icon" data-icon="gear" aria-label="הגדרות"></button>
        </div>
      </header>

      <div class="chg-stagebox">
        <div class="chg-note" hidden></div>
        <svg class="chg-svg" role="img" aria-label="הבמה מלמעלה"></svg>
        <div class="chg-3d"></div>
        <div class="chg-colors" hidden aria-label="בחירה לפי צבע"></div>
        <div class="chg-selbar" hidden>
          <span class="chg-seln"></span>
          <button id="chg-sel-card" type="button">צבע ופרטים</button>
          <button id="chg-sel-align" type="button">סידור</button>
          <button id="chg-sel-off" type="button">הוצאה מהמערך</button>
          <button id="chg-sel-none" type="button" class="chg-icon" data-icon="close" aria-label="ביטול הבחירה"></button>
        </div>
        <div class="chg-yt" hidden></div>
      </div>

      <div class="chg-timebox" dir="ltr">
        <div class="chg-ftools" hidden>
          <button id="chg-f-edit" type="button" data-icon="dup" aria-label="שכפול המערך"></button>
          <button id="chg-f-del" type="button" data-icon="trash" aria-label="מחיקת המערך"></button>
          <button id="chg-f-more" type="button" data-icon="more" aria-label="עוד"></button>
        </div>
        <div class="chg-time" aria-live="off">0:00</div>
        <div class="chg-tl">
          <div class="chg-strip"></div>
          <canvas class="chg-wave" hidden aria-hidden="true"></canvas>
        </div>
        <div class="chg-playhead" aria-hidden="true"></div>
      </div>

      <footer class="chg-bottom">
        <div class="chg-bside">
          <button id="chg-full" type="button" class="chg-icon" data-icon="full" aria-label="מסך מלא"></button>
          <button id="chg-3d" type="button" class="chg-icon" data-icon="cube" aria-label="תלת-ממד" aria-pressed="false"></button>
        </div>
        <button id="chg-play" type="button" class="chg-play" data-icon="play" aria-label="נגן"></button>
        <div class="chg-bside">
          <button id="chg-props" type="button" class="chg-icon" data-icon="props" aria-label="תפאורה"></button>
          <button id="chg-dancers" type="button" class="chg-icon" data-icon="addp" aria-label="רקדניות"></button>
        </div>
      </footer>
    </section>

    <div class="chg-toast" role="status" aria-live="polite"></div>
  </div>
  <noscript><p>אפליקציית העימוד צריכה JavaScript.</p></noscript>
</main>
<div class="chg-print" aria-hidden="true"></div>
